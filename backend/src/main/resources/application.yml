server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

spring:
  application:
    name: shining-crescent-api
  datasource:
    url: jdbc:postgresql://localhost:5432/shiningcrescent
    username: rc
    password: rc_secret
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:89951539489-7nomub0amr0v8sf732qej9jfr39niatj.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET: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}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope:
              - openid
              - profile
              - email
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    listener:
      auto-startup: ${KAFKA_ENABLED:false}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: shining-crescent
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  jwt:
    secret: ShiningCrescentHarvestMoonJwtSigningKeyMustBeLongEnough2026!!
    expiration-ms: 86400000
  oidc:
    issuer: ${APP_OIDC_ISSUER:}
  oauth2:
    client-id: ${APP_OAUTH2_CLIENT_ID:shining-crescent-spa}
    redirect-uris: ${APP_OAUTH2_REDIRECT_URIS:https://54.175.201.2.sslip.io/,https://54.175.201.2.sslip.io,http://localhost:5173/,http://localhost:5173,http://127.0.0.1:5173/,http://127.0.0.1:5173}
  upload-dir: ${UPLOAD_DIR:./uploads}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      orders: rc.orders
      inventory: rc.inventory
      notifications: rc.notifications
